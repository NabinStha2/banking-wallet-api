server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: wallet-api

  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/${DB_NAME:wallet}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&sessionVariables=innodb_lock_wait_timeout=5}"
    username: "${DB_USER:root}"
    password: "${DB_PASSWORD:root}"
    hikari:
      pool-name: WalletApiPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.nabin: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.flywaydb: DEBUG

app:
  jwt:
    # Development placeholder only; override with a secure secret
    secret: "${JWT_SECRET:dev-only-secret-change-me-please-0123456789}"
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

  admin:
    email: "${ADMIN_EMAIL:}"
    password: "${ADMIN_PASSWORD:}"
