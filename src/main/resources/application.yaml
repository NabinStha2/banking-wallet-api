# src/main/resources/application.yml
# Base config: safe for every environment. No secret defaults here.
# Local development is the default. Production must be selected explicitly.

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: banking-wallet-api

  profiles:
    default: dev

  lifecycle:
    timeout-per-shutdown-phase: 20s

  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3307/${DB_NAME:banking_wallet}?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&sessionVariables=innodb_lock_wait_timeout=5}"
    username: "${DB_APP_USER:banking_wallet_app}"
    password: "${DB_APP_PASSWORD}"
    hikari:
      pool-name: WalletApiPool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.nabin: INFO
    org.springframework.security: INFO

app:
  jwt:
    secret: "${JWT_SECRET}"
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

  admin:
    email: "${ADMIN_EMAIL:}"
    password: "${ADMIN_PASSWORD:}"
