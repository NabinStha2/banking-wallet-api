# Production overrides only. Activate explicitly with SPRING_PROFILES_ACTIVE=prod.

server:
  # Set to framework only when a trusted TLS proxy sanitizes forwarded headers.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  datasource:
    # Production must provide a TLS-enabled DB_URL (or another explicitly secured URL).
    url: "${DB_URL}"
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.nabin: INFO
    org.springframework.security: WARN
