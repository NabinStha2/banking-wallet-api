# Production overrides only. Activate explicitly with SPRING_PROFILES_ACTIVE=prod.

server:
  # Set to framework only when a trusted TLS proxy sanitizes forwarded headers.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

spring:
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}

  datasource:
    # Production must provide a TLS-enabled DB_URL (or another explicitly secured URL).
    url: "${DB_URL}"
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

management:
  endpoint:
    health:
      show-details: never

app:
  email-verification:
    page-url: ${EMAIL_VERIFICATION_PAGE_URL}
    from: ${EMAIL_FROM}

logging:
  level:
    root: WARN
    com.nabin: INFO
    org.springframework.security: WARN
