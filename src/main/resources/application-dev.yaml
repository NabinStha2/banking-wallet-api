# Local development only. Activate with: SPRING_PROFILES_ACTIVE=dev
# SQL logging is useful locally; bind values are deliberately not logged.

spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS_ENABLE:false}
      mail.smtp.connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}

  datasource:
    username: "${DB_APP_USER:banking_wallet_app}"
    password: "${DB_APP_PASSWORD:dev-only-db-password}"

  jpa:
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.nabin: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG

app:
  jwt:
    secret: "${JWT_SECRET:dev-only-secret-change-me-please-0123456789}"
